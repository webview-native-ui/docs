<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      ion-list {
        width: 100%;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-list>
            <ion-item>
              <ion-input label="Default input"></ion-input>
            </ion-item>

            <ion-item>
              <ion-input label="Input with placeholder" placeholder="Enter company name"></ion-input>
            </ion-item>

            <ion-item>
              <ion-input label="Input with value" value="121 S Pinckney St #300"></ion-input>
            </ion-item>

            <ion-item>
              <ion-input label="Readonly input" value="Madison" readonly="true"></ion-input>
            </ion-item>

            <ion-item>
              <ion-input label="Disabled input" value="53703" disabled="true"></ion-input>
            </ion-item>
          </ion-list>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
