<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        max-width: 200px;
        margin: 0 auto;
      }

      ion-input.custom {
        --background: #373737;
        --color: #fff;
        --placeholder-color: #ddd;
        --placeholder-opacity: 0.8;

        --padding-bottom: 10px;
        --padding-end: 10px;
        --padding-start: 10px;
        --padding-top: 10px;
      }

      ion-input.custom.ios .input-bottom .helper-text,
      ion-input.custom.ios .input-bottom .counter,
      ion-input.custom.md .input-bottom .helper-text,
      ion-input.custom.md .input-bottom .counter {
        color: var(--ion-color-primary);
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-input
            aria-label="Custom input"
            placeholder="Custom input"
            class="custom"
            helper-text="Helper text"
            counter="true"
            maxlength="20"
          ></ion-input>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
