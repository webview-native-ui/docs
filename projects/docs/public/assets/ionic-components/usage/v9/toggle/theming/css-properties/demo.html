<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      ion-toggle {
        padding: 12px;

        --track-background: #ddd;
        --track-background-checked: #ddd;

        --handle-background: #eb7769;
        --handle-background-checked: #95c34e;

        --handle-width: 25px;
        --handle-height: 27px;
        --handle-max-height: auto;
        --handle-spacing: 6px;

        --handle-border-radius: 4px;
        --handle-box-shadow: none;
      }

      ion-toggle::part(track) {
        height: 10px;
        width: 65px;

        overflow: visible;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-toggle aria-label="Enable Notifications"></ion-toggle>
          <ion-toggle checked="true" aria-label="Enable Notifications"></ion-toggle>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
