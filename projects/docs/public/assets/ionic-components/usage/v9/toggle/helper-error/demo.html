<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <style>
      ion-toggle {
        width: 300px;
      }
    </style>

    <div class="container">
      <ion-toggle
        helper-text="Enable to connect to available networks"
        error-text="Must be enabled to access the internet"
        checked
      >
        Wi-Fi
      </ion-toggle>
    </div>

    <script>
      const wifi = document.querySelector('ion-toggle');

      wifi.addEventListener('ionChange', (event) => validateToggle(event));

      const validateToggle = (event) => {
        wifi.classList.add('ion-touched');

        if (!event.detail.checked) {
          wifi.classList.add('ion-invalid');
          wifi.classList.remove('ion-valid');
        } else {
          wifi.classList.remove('ion-invalid');
          wifi.classList.add('ion-valid');
        }
      };
    </script>
  </body>
</html>
