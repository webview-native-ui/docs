<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        flex-direction: column;
        justify-content: space-evenly;
      }

      ion-grid {
        width: 100%;
        flex-grow: 0;
      }

      ion-col {
        background-color: #135d54;
        border: solid 1px #fff;
        color: #fff;
        text-align: center;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <b>No offset for xs breakpoint, offset 1st column for sm and up</b>
          <ion-grid>
            <ion-row>
              <ion-col offset-sm="2">1</ion-col>
              <ion-col>2</ion-col>
              <ion-col>3</ion-col>
              <ion-col>4</ion-col>
              <ion-col>5</ion-col>
            </ion-row>
          </ion-grid>

          <b>No offset for xs breakpoint, offset last 3 columns for md and up</b>
          <ion-grid>
            <ion-row>
              <ion-col>1</ion-col>
              <ion-col offset-md="2">2</ion-col>
              <ion-col offset-md="2">3</ion-col>
              <ion-col offset-md="2">4</ion-col>
            </ion-row>
          </ion-grid>

          <b>Offset all columns by 6 for xs breakpoint, offset by 4 for md, offset by 2 for lg and up</b>
          <ion-grid>
            <ion-row>
              <ion-col offset="6" offset-md="4" offset-lg="2">1</ion-col>
              <ion-col offset="6" offset-md="4" offset-lg="2">2</ion-col>
            </ion-row>
          </ion-grid>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
