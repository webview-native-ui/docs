<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Searchbar</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        display: block;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-searchbar debounce="1000"></ion-searchbar>
          <ion-list></ion-list>
        </div>
      </ion-content>
    </ion-app>
  </body>

  <script>
    const searchbar = document.querySelector('ion-searchbar');
    const list = document.querySelector('ion-list');

    const data = [
      'Amsterdam',
      'Buenos Aires',
      'Cairo',
      'Geneva',
      'Hong Kong',
      'Istanbul',
      'London',
      'Madrid',
      'New York',
      'Panama City',
    ];
    let results = [...data];
    filterItems(results);

    searchbar.addEventListener('ionInput', handleInput);

    function handleInput(event) {
      const query = event.target.value.toLowerCase();
      results = data.filter((d) => d.toLowerCase().indexOf(query) > -1);
      filterItems(results);
    }

    function filterItems(results) {
      list.replaceChildren();

      let items = '';

      for (let i = 0; i < results.length; i++) {
        items += `
        <ion-item>
          <ion-label>${results[i]}</ion-label>
        </ion-item>
      `;
      }

      list.innerHTML = items;
    }
  </script>
</html>
