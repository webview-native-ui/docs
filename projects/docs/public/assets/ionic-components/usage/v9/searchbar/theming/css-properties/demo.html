<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Searchbar</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        flex-flow: column;
      }

      ion-searchbar.custom {
        --background: #19422d;
        --color: #fff;
        --placeholder-color: #fff;
        --icon-color: #fff;
        --clear-button-color: #fff;

        --border-radius: 4px;
      }

      ion-searchbar.ios.custom {
        --cancel-button-color: #19422d;
      }

      ion-searchbar.md.custom {
        --cancel-button-color: #fff;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-searchbar show-cancel-button="focus" class="custom"></ion-searchbar>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
