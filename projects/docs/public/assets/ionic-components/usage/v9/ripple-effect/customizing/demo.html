<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ripple Effect</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .wrapper {
        display: flex;
        flex-wrap: wrap;

        align-items: center;
        justify-content: space-between;
        text-align: center;

        height: 170px;
        width: 400px;

        margin: 0 auto;
      }

      b {
        width: 100%;
      }

      .ripple-parent {
        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;
        overflow: hidden;

        border: 1px solid #ddd;

        user-select: none;

        width: 100%;
        height: 50px;
        border-radius: 8px;
      }

      .custom-parent {
        color: #de1e7e;
      }

      .custom-ripple {
        color: #501ace;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <div class="wrapper">
            <b>Click on a shape to see the ripple</b>

            <div class="ion-activatable ripple-parent custom-parent">
              Custom Parent Color
              <ion-ripple-effect></ion-ripple-effect>
            </div>

            <div class="ion-activatable ripple-parent">
              Custom Ripple Color
              <ion-ripple-effect class="custom-ripple"></ion-ripple-effect>
            </div>
          </div>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
