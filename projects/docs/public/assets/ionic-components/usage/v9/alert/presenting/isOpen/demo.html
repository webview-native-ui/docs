<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alert</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-button onclick="alert.isOpen = true">Click Me</ion-button>
          <ion-alert
            header="A Short Title Is Best"
            sub-header="A Sub Header Is Optional"
            message="A message should be a short, complete sentence."
          ></ion-alert>
        </div>
      </ion-content>
    </ion-app>

    <script>
      const alert = document.querySelector('ion-alert');

      alert.buttons = ['Action'];
      alert.addEventListener('ionAlertDidDismiss', () => {
        alert.isOpen = false;
      });
    </script>
  </body>
</html>
