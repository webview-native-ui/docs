<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alert</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-button onclick="presentAlert()">Click Me</ion-button>
        </div>
      </ion-content>
    </ion-app>

    <script>
      async function presentAlert() {
        const alert = document.createElement('ion-alert');
        alert.header = 'A Short Title Is Best';
        alert.subHeader = 'A Sub Header Is Optional';
        alert.message = 'A message should be a short, complete sentence.';
        alert.buttons = ['Action'];

        document.body.appendChild(alert);
        await alert.present();
      }
    </script>
  </body>
</html>
