<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      ion-radio {
        --border-radius: 4px;
        --inner-border-radius: 4px;

        --color: #ddd;
        --color-checked: #6815ec;
      }

      ion-radio.ios::part(container) {
        width: 20px;
        height: 20px;

        border: 2px solid #ddd;
        border-radius: 4px;
      }

      .radio-checked.ios::part(container) {
        border-color: #6815ec;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-radio-group value="custom-checked">
            <ion-radio value="custom" aria-label="Custom checkbox"></ion-radio>
            <ion-radio value="custom-checked" aria-label="Custom checkbox that is checked"></ion-radio>
          </ion-radio-group>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
