<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-list>
            <ion-radio-group></ion-radio-group>
          </ion-list>
        </div>
      </ion-content>
    </ion-app>

    <script>
      const foods = [
        {
          id: 1,
          name: 'Apples',
          type: 'fruit',
        },
        {
          id: 2,
          name: 'Carrots',
          type: 'vegetable',
        },
        {
          id: 3,
          name: 'Cupcakes',
          type: 'dessert',
        },
      ];

      const compareWithFn = (o1, o2) => {
        return o1.id === o2.id;
      };

      const radioGroupEl = document.querySelector('ion-radio-group');
      radioGroupEl.compareWith = compareWithFn;

      foods.forEach((option, i) => {
        const radio = document.createElement('ion-radio');

        radio.value = option;
        radio.textContent = option.name;

        const item = document.createElement('ion-item');
        item.appendChild(radio);

        radioGroupEl.appendChild(item);
      });

      radioGroupEl.addEventListener('ionChange', () => {
        console.log('Current value:', JSON.stringify(radioGroupEl.value));
      });
    </script>
  </body>
</html>
