<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-list>
            <ion-radio-group value="start">
              <ion-item>
                <ion-radio value="start" label-placement="stacked" alignment="start">Aligned to the Start</ion-radio>
              </ion-item>
            </ion-radio-group>

            <ion-radio-group value="center">
              <ion-item>
                <ion-radio value="center" label-placement="stacked" alignment="center">Aligned to the Center</ion-radio>
              </ion-item>
            </ion-radio-group>
          </ion-list>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
