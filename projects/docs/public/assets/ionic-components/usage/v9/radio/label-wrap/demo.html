<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      ion-list {
        width: 250px;
      }

      ion-radio.wrapped::part(label) {
        white-space: normal;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-list>
            <ion-radio-group value="truncated">
              <ion-item>
                <ion-radio value="truncated">Truncated with ellipsis by default</ion-radio>
              </ion-item>
              <ion-item>
                <ion-radio value="wrapped-part" class="wrapped">
                  Wrapping with text-wrap applied to label shadow part
                </ion-radio>
              </ion-item>
              <ion-item>
                <ion-radio value="wrapped-div">
                  <div class="ion-text-wrap">Wrapping with ion-text-wrap class applied wrapper element</div>
                </ion-radio>
              </ion-item>
            </ion-radio-group>
          </ion-list>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
