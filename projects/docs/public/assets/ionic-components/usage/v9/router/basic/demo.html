<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Router</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-router>
        <ion-route url="/" component="page-one"></ion-route>
        <ion-route url="/page-two" component="page-two"></ion-route>
      </ion-router>

      <ion-router-outlet></ion-router-outlet>

      <script>
        class PageOne extends HTMLElement {
          connectedCallback() {
            this.innerHTML = `
        <ion-header>
          <ion-toolbar>
            <ion-title>Page One</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content class="ion-padding">
          This is the content for page 1.
          <ion-router-link href="#/page-two">
            <ion-button>Go to Page 2</ion-button>
          </ion-router-link>
        </ion-content>`;
          }
        }

        class PageTwo extends HTMLElement {
          connectedCallback() {
            this.innerHTML = `
        <ion-header>
          <ion-toolbar>
            <ion-buttons slot="start">
              <ion-back-button default-href="/"></ion-back-button>
            </ion-buttons>
            <ion-title>Page Two</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content class="ion-padding">
          This is the content for page 2.
        </ion-content>`;
          }
        }

        customElements.define('page-one', PageOne);
        customElements.define('page-two', PageTwo);
      </script>
    </ion-app>
  </body>
</html>
