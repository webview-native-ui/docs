<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popover</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-button>Click Me</ion-button>
        </div>
      </ion-content>
    </ion-app>

    <script>
      class PopoverPage extends HTMLElement {
        constructor() {
          super();
        }

        connectedCallback() {
          this.innerHTML = `<ion-content class="ion-padding">Hello World!</ion-content>`;
        }
      }

      customElements.define('popover-page', PopoverPage);

      async function presentPopover(e) {
        const popover = Object.assign(document.createElement('ion-popover'), {
          component: 'popover-page',
          event: e,
        });

        document.body.appendChild(popover);
        await popover.present();

        const { role } = await popover.onDidDismiss();
        console.log(`Popover dismissed with role: ${role}`);
      }

      const button = document.querySelector('ion-button');
      button.addEventListener('click', presentPopover);
    </script>
  </body>
</html>
