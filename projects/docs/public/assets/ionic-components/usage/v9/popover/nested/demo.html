<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popover</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-button id="popover-button">Open Menu</ion-button>
          <ion-popover trigger="popover-button" dismiss-on-select="true">
            <ion-content>
              <ion-list>
                <ion-item button="true" detail="false">Option 1</ion-item>
                <ion-item button="true" detail="false">Option 2</ion-item>
                <ion-item button="true" id="nested-trigger">More options...</ion-item>

                <ion-popover trigger="nested-trigger" dismiss-on-select="true" side="end">
                  <ion-content>
                    <ion-list>
                      <ion-item button="true" detail="false">Nested option</ion-item>
                    </ion-list>
                  </ion-content>
                </ion-popover>
              </ion-list>
            </ion-content>
          </ion-popover>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
