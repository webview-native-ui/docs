<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popover</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      ion-popover {
        --background: rgba(40, 173, 218, 0.6);
        --backdrop-opacity: 0.6;
        --box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.6);
        --color: white;
        --width: 300px;
      }

      ion-popover ion-content {
        --background: rgba(40, 173, 218, 0.6);
      }

      ion-popover::part(backdrop) {
        background-color: rgb(6, 14, 106);
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-button id="trigger-button">Click Me</ion-button>
          <ion-popover trigger="trigger-button">
            <ion-content class="ion-padding">Hello Styled World!</ion-content>
          </ion-popover>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
