<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popover</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-button id="click-trigger">Left-Click Me</ion-button>
          <ion-popover trigger="click-trigger" trigger-action="click">
            <ion-content class="ion-padding">Hello World!</ion-content>
          </ion-popover>

          <ion-button id="context-menu-trigger">Right-Click Me</ion-button>
          <ion-popover trigger="context-menu-trigger" trigger-action="context-menu">
            <ion-content class="ion-padding">Hello World!</ion-content>
          </ion-popover>

          <ion-button id="hover-trigger">Hover Over Me</ion-button>
          <ion-popover trigger="hover-trigger" trigger-action="hover">
            <ion-content class="ion-padding">Hello World!</ion-content>
          </ion-popover>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
