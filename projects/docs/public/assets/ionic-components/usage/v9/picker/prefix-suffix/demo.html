<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picker | Slot</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-picker>
            <ion-picker-column value="1">
              <div slot="prefix">$</div>
              <ion-picker-column-option value="" disabled="true">--</ion-picker-column-option>
              <ion-picker-column-option value="1">1</ion-picker-column-option>
              <ion-picker-column-option value="2">2</ion-picker-column-option>
              <ion-picker-column-option value="3">3</ion-picker-column-option>
              <ion-picker-column-option value="4">4</ion-picker-column-option>
              <ion-picker-column-option value="5">5</ion-picker-column-option>
              <div slot="suffix">USD</div>
            </ion-picker-column>
          </ion-picker>
        </div>
      </ion-content>
    </ion-app>
    <script></script>
  </body>
</html>
