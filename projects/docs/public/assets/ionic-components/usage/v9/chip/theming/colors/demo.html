<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chip</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .flex-items {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        max-width: 440px;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <div class="flex-items">
            <ion-chip>Default</ion-chip>
            <ion-chip color="primary">Primary</ion-chip>
            <ion-chip color="secondary">Secondary</ion-chip>
            <ion-chip color="tertiary">Tertiary</ion-chip>
            <ion-chip color="success">Success</ion-chip>
            <ion-chip color="warning">Warning</ion-chip>
            <ion-chip color="danger">Danger</ion-chip>
            <ion-chip color="light">Light</ion-chip>
            <ion-chip color="medium">Medium</ion-chip>
            <ion-chip color="dark">Dark</ion-chip>
          </div>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
