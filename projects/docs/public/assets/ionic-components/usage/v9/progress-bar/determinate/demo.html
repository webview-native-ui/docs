<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progress Bar</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-progress-bar></ion-progress-bar>
        </div>
      </ion-content>
    </ion-app>
  </body>

  <script>
    let progress = 0;
    let progressBar = document.querySelector('ion-progress-bar');

    setInterval(() => {
      progressBar.value = progress += 0.01;

      // Reset the progress bar when it reaches 100%
      // to continuously show the demo
      if (progress > 1) {
        setTimeout(() => {
          progressBar.value = progress = 0;
        }, 1000);
      }
    }, 50);
  </script>
</html>
