<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Label</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        display: block;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-item>
            <ion-label>Default Label</ion-label>
          </ion-item>

          <ion-item>
            <ion-label>
              Multi-line text that should ellipsis when it is too long to fit on one line. Lorem ipsum dolor sit amet,
              consectetur adipiscing elit.
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-label class="ion-text-wrap">
              Multi-line text that should wrap when it is too long to fit on one line. Lorem ipsum dolor sit amet,
              consectetur adipiscing elit.
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-label>
              <h1>Heading</h1>
              <p>Paragraph</p>
            </ion-label>
          </ion-item>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
