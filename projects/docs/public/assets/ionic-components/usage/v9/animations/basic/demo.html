<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
    <script type="module">
      import { createAnimation } from '/assets/ionic-components/runtime/dist/ionic/index.esm.js';
      window.createAnimation = createAnimation;

      const animation = createAnimation()
        .addElement(document.querySelector('#card'))
        .duration(1500)
        .iterations(Infinity)
        .fromTo('transform', 'translateX(0px)', 'translateX(100px)')
        .fromTo('opacity', '1', '0.2');

      document.querySelector('#play').addEventListener('click', () => {
        animation.play();
      });

      document.querySelector('#pause').addEventListener('click', () => {
        animation.pause();
      });

      document.querySelector('#stop').addEventListener('click', () => {
        animation.stop();
      });
    </script>

    <style>
      .container {
        flex-direction: column;
      }

      ion-card {
        width: 70%;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <div class="container">
      <ion-card id="card">
        <ion-card-content>Card</ion-card-content>
      </ion-card>

      <div>
        <ion-button id="play">Play</ion-button>
        <ion-button id="pause">Pause</ion-button>
        <ion-button id="stop">Stop</ion-button>
      </div>
    </div>
  </body>
</html>
