<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Segment Button</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        max-width: 400px;
        margin: 0 auto;
      }

      ion-segment-button {
        --indicator-color: #08a391;
      }

      /* Material Design styles */
      ion-segment-button.md {
        --color: #000;
        --color-checked: #08a391;
        --indicator-height: 4px;
      }

      /* iOS styles */
      ion-segment-button.ios {
        --color: #08a391;
        --color-checked: #fff;
        --border-radius: 20px;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-segment value="custom">
            <ion-segment-button value="custom">
              <ion-label>Custom</ion-label>
            </ion-segment-button>
            <ion-segment-button value="segment">
              <ion-label>Segment</ion-label>
            </ion-segment-button>
            <ion-segment-button value="buttons">
              <ion-label>Buttons</ion-label>
            </ion-segment-button>
          </ion-segment>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
