<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Back Button</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-nav root="page-one"></ion-nav>
    </ion-app>

    <script>
      class PageOne extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
        <ion-header>
          <ion-toolbar>
            <ion-title>Back Button</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content class="ion-padding">
          <h1>Page One</h1>
          <p>Navigate to the next page to see the back button.</p>
          <ion-nav-link router-direction="forward" component="page-two">
            <ion-button>Navigate</ion-button>
          </ion-nav-link>
        </ion-content>
      `;
        }
      }

      class PageTwo extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
        <ion-header>
          <ion-toolbar>
            <ion-buttons slot="start">
              <ion-back-button></ion-back-button>
            </ion-buttons>
            <ion-title>Back Button</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content class="ion-padding">
          <h1>Page Two</h1>
          <p>Use the back button to navigate to the previous page.</p>
        </ion-content>
      `;
        }
      }

      customElements.define('page-one', PageOne);
      customElements.define('page-two', PageTwo);
    </script>
  </body>
</html>
