<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Segment</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        flex-flow: column;
        justify-content: space-evenly;

        max-width: 400px;
        margin: 0 auto;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-segment value="default">
            <ion-segment-button value="default">
              <ion-label>Default</ion-label>
            </ion-segment-button>
            <ion-segment-button value="segment">
              <ion-label>Segment</ion-label>
            </ion-segment-button>
          </ion-segment>

          <ion-segment disabled value="disabled">
            <ion-segment-button value="disabled">
              <ion-label>Disabled</ion-label>
            </ion-segment-button>
            <ion-segment-button value="segment">
              <ion-label>Segment</ion-label>
            </ion-segment-button>
          </ion-segment>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
