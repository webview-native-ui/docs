<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        display: block;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-item>
            <ion-label>Default Item</ion-label>
          </ion-item>
          <ion-item color="primary">
            <ion-label>Primary Item</ion-label>
          </ion-item>
          <ion-item color="secondary">
            <ion-label>Secondary Item</ion-label>
          </ion-item>
          <ion-item color="tertiary">
            <ion-label>Tertiary Item</ion-label>
          </ion-item>
          <ion-item color="success">
            <ion-label>Success Item</ion-label>
          </ion-item>
          <ion-item color="warning">
            <ion-label>Warning Item</ion-label>
          </ion-item>
          <ion-item color="danger">
            <ion-label>Danger Item</ion-label>
          </ion-item>
          <ion-item color="light">
            <ion-label>Light Item</ion-label>
          </ion-item>
          <ion-item color="medium">
            <ion-label>Medium Item</ion-label>
          </ion-item>
          <ion-item color="dark">
            <ion-label>Dark Item</ion-label>
          </ion-item>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
