<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        display: block;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-item>
            <ion-input label="Default Input" placeholder="Enter text"></ion-input>
          </ion-item>

          <ion-item>
            <ion-input label="Fixed Input" label-placement="fixed" placeholder="Enter text"></ion-input>
          </ion-item>

          <ion-item>
            <ion-input label="Stacked Input" label-placement="stacked" placeholder="Enter text"></ion-input>
          </ion-item>

          <ion-item>
            <ion-input label="Floating Input" label-placement="floating" placeholder="Enter text"></ion-input>
          </ion-item>

          <ion-item>
            <ion-select label="Select" placeholder="Make a Selection">
              <ion-select-option value="">No Game Console</ion-select-option>
              <ion-select-option value="nes">NES</ion-select-option>
              <ion-select-option value="n64">Nintendo64</ion-select-option>
              <ion-select-option value="ps">PlayStation</ion-select-option>
              <ion-select-option value="genesis">Sega Genesis</ion-select-option>
              <ion-select-option value="saturn">Sega Saturn</ion-select-option>
              <ion-select-option value="snes">SNES</ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item>
            <ion-toggle> Toggle </ion-toggle>
          </ion-item>

          <ion-item>
            <ion-checkbox> Checkbox </ion-checkbox>
          </ion-item>

          <ion-item>
            <ion-range label-placement="start">
              <div slot="label">Range</div>
            </ion-range>
          </ion-item>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
