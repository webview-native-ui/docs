<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select - Styling the Select</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        flex-direction: column;
      }

      ion-input-otp.custom {
        --separator-color: rgb(90, 23, 237, 0.12);
        --highlight-color-focused: #5a17ed;
      }

      .input-otp-fill-outline.custom {
        --border-color: rgb(90, 23, 237, 0.6);
        --color: #5a17ed;
      }

      .input-otp-fill-solid.custom {
        --border-color: rgb(90, 23, 237, 0.12);
        --background: rgb(90, 23, 237, 0.12);
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-input-otp class="custom" separators="all">
            Didn't get a code? <a href="#">Resend the code</a>
          </ion-input-otp>
          <ion-input-otp fill="solid" class="custom" separators="all">
            Didn't get a code? <a href="#">Resend the code</a>
          </ion-input-otp>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
