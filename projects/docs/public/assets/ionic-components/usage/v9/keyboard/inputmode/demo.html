<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      ion-list {
        min-width: 320px;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-list>
            <ion-item>
              <ion-input inputmode="email" label-placement="stacked" placeholder="Enter a username or email address">
                <code slot="label">inputmode="email"</code>
              </ion-input>
            </ion-item>
            <ion-item>
              <ion-input inputmode="numeric" label-placement="stacked" placeholder="Enter an integer">
                <code slot="label">inputmode="numeric"</code>
              </ion-input>
            </ion-item>
            <ion-item>
              <ion-input inputmode="decimal" label-placement="stacked" placeholder="Enter a decimal">
                <code slot="label">inputmode="decimal"</code>
              </ion-input>
            </ion-item>
          </ion-list>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
