<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Textarea - Basic Usage</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      ion-list {
        width: calc(100% - 20px);
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-list>
            <ion-item>
              <ion-textarea label="Regular textarea" placeholder="Type something here"></ion-textarea>
            </ion-item>
            <ion-item>
              <ion-textarea readonly="true" label="Readonly textarea" placeholder="Can't edit this"></ion-textarea>
            </ion-item>
            <ion-item>
              <ion-textarea disabled="true" label="Disabled textarea" placeholder="Can't type here"></ion-textarea>
            </ion-item>
          </ion-list>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
