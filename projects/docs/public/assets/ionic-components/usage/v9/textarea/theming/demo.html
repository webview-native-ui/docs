<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Textarea - Theming</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
    <style>
      .container {
        padding: 0 40px;
      }

      ion-textarea.custom {
        --background: #373737;
        --color: #fff;
        --padding-end: 10px;
        --padding-start: 10px;
        --placeholder-color: #ddd;
        --placeholder-opacity: 0.8;
      }

      ion-textarea.custom.ios .textarea-bottom .helper-text,
      ion-textarea.custom.ios .textarea-bottom .counter,
      ion-textarea.custom.md .textarea-bottom .helper-text,
      ion-textarea.custom.md .textarea-bottom .counter {
        color: var(--ion-color-primary);
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-textarea
            aria-label="Custom textarea"
            placeholder="Type something here"
            class="custom"
            helper-text="Helper text"
            counter="true"
            maxlength="100"
          ></ion-textarea>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
