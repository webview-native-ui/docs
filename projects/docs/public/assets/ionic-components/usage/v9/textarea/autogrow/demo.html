<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Textarea - Autogrow</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        display: block;

        padding: 0 40px;
      }

      ion-item {
        width: 100%;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-item>
            <ion-textarea
              placeholder="Type something here"
              auto-grow="true"
              value="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Mauris tellus sem, auctor accumsan egestas sed, venenatis at ex. Nam consequat ex odio, suscipit rhoncus orci dictum eget. Aenean sit amet ligula varius felis facilisis lacinia nec volutpat nulla. Duis ullamcorper sit amet turpis sed blandit. Integer pretium massa eu faucibus interdum."
            >
            </ion-textarea>
          </ion-item>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
