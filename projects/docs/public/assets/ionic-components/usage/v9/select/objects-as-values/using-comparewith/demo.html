<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select - Using compareWith</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-list>
            <ion-item>
              <ion-select aria-label="Food" placeholder="Select food"></ion-select>
            </ion-item>
          </ion-list>
        </div>
      </ion-content>
    </ion-app>

    <script>
      const foods = [
        {
          id: 1,
          name: 'Apples',
          type: 'fruit',
        },
        {
          id: 2,
          name: 'Carrots',
          type: 'vegetable',
        },
        {
          id: 3,
          name: 'Cupcakes',
          type: 'dessert',
        },
      ];

      const compareWithFn = (o1, o2) => {
        return o1 && o2 ? o1.id === o2.id : o1 === o2;
      };

      const selectEl = document.querySelector('ion-select');
      selectEl.compareWith = compareWithFn;

      foods.forEach((option, i) => {
        const selectOption = document.createElement('ion-select-option');
        selectOption.value = option;
        selectOption.textContent = option.name;
        selectEl.appendChild(selectOption);
      });

      selectEl.addEventListener('ionChange', () => {
        console.log('Current value:', JSON.stringify(selectEl.value));
      });
    </script>
  </body>
</html>
