<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item Divider</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        flex-flow: column;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-item-divider>
            <ion-label>Default</ion-label>
          </ion-item-divider>
          <ion-item-divider color="primary">
            <ion-label>Primary</ion-label>
          </ion-item-divider>
          <ion-item-divider color="secondary">
            <ion-label>Secondary</ion-label>
          </ion-item-divider>
          <ion-item-divider color="tertiary">
            <ion-label>Tertiary</ion-label>
          </ion-item-divider>
          <ion-item-divider color="success">
            <ion-label>Success</ion-label>
          </ion-item-divider>
          <ion-item-divider color="warning">
            <ion-label>Warning</ion-label>
          </ion-item-divider>
          <ion-item-divider color="danger">
            <ion-label>Danger</ion-label>
          </ion-item-divider>
          <ion-item-divider color="light">
            <ion-label>Light</ion-label>
          </ion-item-divider>
          <ion-item-divider color="medium">
            <ion-label>Medium</ion-label>
          </ion-item-divider>
          <ion-item-divider color="dark">
            <ion-label>Dark</ion-label>
          </ion-item-divider>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
