<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toast</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar>
          <ion-title>Toast</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <div class="container">
          <ion-button id="open-toast">Open Toast</ion-button>
          <ion-toast trigger="open-toast" duration="3000" message="Hello World!"></ion-toast>
        </div>
      </ion-content>
    </ion-app>

    <script>
      const toast = document.querySelector('ion-toast');

      toast.buttons = [
        {
          text: 'More Info',
          role: 'info',
          handler: () => {
            console.log('More Info clicked');
          },
        },
        {
          text: 'Dismiss',
          role: 'cancel',
          handler: () => {
            console.log('Dismiss clicked');
          },
        },
      ];

      toast.addEventListener('ionToastDidDismiss', (event) => {
        const { role } = event.detail;
        console.log(`Dismissed with role: ${role}`);
      });
    </script>
  </body>
</html>
