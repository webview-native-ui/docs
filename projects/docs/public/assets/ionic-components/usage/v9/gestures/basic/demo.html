<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
    <script type="module">
      import { createGesture } from '/assets/ionic-components/runtime/dist/ionic/index.esm.js';
      window.createGesture = createGesture;

      const p = document.querySelector('#debug');
      const target = document.querySelector('ion-content');
      const card = document.querySelector('ion-card');

      const onMove = (detail) => {
        const { type, currentX, deltaX, velocityX } = detail;
        p.innerHTML = `
          <div>Type: ${type}</div>
    <div>Current X: ${currentX}</div>
    <div>Delta X: ${deltaX}</div>
    <div>Velocity X: ${velocityX}</div>`;
      };

      const onStart = () => {
        card.classList.add('active');
      };

      const onEnd = () => {
        card.classList.remove('active');
      };

      const gesture = createGesture({
        el: target,
        onStart,
        onMove,
        onEnd,
        gestureName: 'example',
      });

      gesture.enable();
    </script>

    <style>
      .container {
        flex-direction: column;
      }

      ion-card {
        position: absolute;

        left: 0;
        right: 0;

        user-select: none;
      }

      ion-card.active {
        box-shadow: var(--ion-color-warning) 0px 4px 16px;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <div class="container">
      <ion-content>
        <ion-card>
          <ion-card-header>
            <ion-card-subtitle>Pan the Screen</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p id="debug">Gesture information will display after interaction.</p>
          </ion-card-content>
        </ion-card>
      </ion-content>
    </div>
  </body>
</html>
