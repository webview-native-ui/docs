<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal | Can Dismiss</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <div class="ion-page">
        <ion-header>
          <ion-toolbar>
            <ion-title>App</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content class="ion-padding">
          <ion-button id="open-modal" expand="block">Open</ion-button>

          <ion-modal trigger="open-modal">
            <ion-header>
              <ion-toolbar>
                <ion-title>Modal</ion-title>
                <ion-buttons slot="end">
                  <ion-button onclick="dismiss()">Close</ion-button>
                </ion-buttons>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <p class="ion-padding-horizontal">You must accept the terms and conditions to close this modal.</p>
              <ion-item>
                <ion-checkbox id="terms">
                  <div class="ion-text-wrap">Do you accept the terms and conditions?</div>
                </ion-checkbox>
              </ion-item>
            </ion-content>
          </ion-modal>
        </ion-content>
      </div>
    </ion-app>

    <script>
      const modal = document.querySelector('ion-modal');

      modal.canDismiss = false;
      modal.presentingElement = document.querySelector('.ion-page');

      function dismiss() {
        modal.dismiss();
      }

      modal.addEventListener('didPresent', () => {
        const terms = document.getElementById('terms');
        terms.addEventListener('ionChange', (event) => {
          modal.canDismiss = event.detail.checked;
        });
      });
    </script>
  </body>
</html>
