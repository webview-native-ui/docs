<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal | Inline</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar>
          <ion-title>Inline Modal</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-button id="open-modal" expand="block">Open</ion-button>
        <p id="message">This modal example uses triggers to automatically open a modal when the button is clicked.</p>
        <ion-modal trigger="open-modal">
          <ion-header>
            <ion-toolbar>
              <ion-buttons slot="start">
                <ion-button onclick="cancel()">Cancel</ion-button>
              </ion-buttons>
              <ion-title>Welcome</ion-title>
              <ion-buttons slot="end">
                <ion-button onclick="confirm()" strong="true">Confirm</ion-button>
              </ion-buttons>
            </ion-toolbar>
          </ion-header>
          <ion-content class="ion-padding">
            <ion-item>
              <ion-input
                label="Enter your name"
                label-placement="stacked"
                type="text"
                placeholder="Your name"
              ></ion-input>
            </ion-item>
          </ion-content>
        </ion-modal>
      </ion-content>
    </ion-app>

    <script>
      const modal = document.querySelector('ion-modal');

      function cancel() {
        modal.dismiss(null, 'cancel');
      }

      function confirm() {
        const input = document.querySelector('ion-input');
        modal.dismiss(input.value, 'confirm');
      }

      modal.addEventListener('willDismiss', (event) => {
        if (event.detail.role === 'confirm') {
          const message = document.querySelector('#message');
          message.textContent = `Hello ${event.detail.data}!`;
        }
      });
    </script>
  </body>
</html>
