<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal | Sheet</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar>
          <ion-title>App</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-button id="open-modal" expand="block">Open Sheet Modal</ion-button>

        <ion-modal trigger="open-modal" initial-breakpoint="0.25" handle-behavior="cycle">
          <ion-content class="ion-padding">
            <div class="ion-margin-top">
              <ion-label>Click the handle above to advance to the next breakpoint.</ion-label>
            </div>
          </ion-content>
        </ion-modal>
      </ion-content>
    </ion-app>

    <script>
      const modal = document.querySelector('ion-modal');

      modal.breakpoints = [0, 0.25, 0.5, 0.75];
    </script>
  </body>
</html>
