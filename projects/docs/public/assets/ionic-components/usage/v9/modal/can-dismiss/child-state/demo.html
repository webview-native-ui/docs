<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal | Can Dismiss</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <div class="ion-page">
        <ion-header>
          <ion-toolbar>
            <ion-title>App</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content class="ion-padding">
          <ion-button id="open-modal" expand="block">Open</ion-button>

          <ion-modal trigger="open-modal">
            <ion-header>
              <ion-toolbar>
                <ion-title>Modal</ion-title>
                <ion-buttons slot="end">
                  <ion-button onclick="dismiss()">Close</ion-button>
                </ion-buttons>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <ion-list>
                <ion-item>
                  <ion-checkbox id="override-dismiss">
                    Override Dismiss<br />
                    <ion-note class="ion-text-wrap"
                      >Toggle the checkbox to allow immediately dismissing the modal without a prompt.</ion-note
                    >
                  </ion-checkbox>
                </ion-item>
              </ion-list>
            </ion-content>
          </ion-modal>
        </ion-content>
      </div>
    </ion-app>

    <script>
      const modal = document.querySelector('ion-modal');

      modal.canDismiss = promptClose;
      modal.presentingElement = document.querySelector('.ion-page');

      let canDismissCheckbox = false;

      function dismiss() {
        modal.dismiss();
      }
      const checkbox = document.querySelector('#override-dismiss');
      checkbox.addEventListener('ionChange', (event) => {
        canDismissCheckbox = event.detail.checked;
      });

      async function promptClose() {
        if (canDismissCheckbox) {
          return true;
        }
        const actionSheet = document.createElement('ion-action-sheet');

        actionSheet.header = 'Are you sure?';
        actionSheet.buttons = [
          {
            text: 'Yes',
            role: 'confirm',
          },
          {
            text: 'No',
            role: 'cancel',
          },
        ];
        document.body.appendChild(actionSheet);
        await actionSheet.present();

        const { role } = await actionSheet.onWillDismiss();

        return role === 'confirm';
      }
    </script>
  </body>
</html>
