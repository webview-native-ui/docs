<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .container {
        display: grid;
        grid-template-columns: repeat(2, auto);
        column-gap: 10px;
        justify-items: center;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-button id="buttonToFocus" fill="outline">Button</ion-button>

          <ion-radio-group value="a">
            <ion-radio id="radioToFocus" value="a">Radio</ion-radio>
          </ion-radio-group>

          <ion-button onClick="focusElement('#buttonToFocus')">Focus Button</ion-button>
          <ion-button onClick="focusElement('#radioToFocus')">Focus Radio</ion-button>
        </div>

        <script>
          function focusElement(id) {
            const el = document.querySelector(id);

            const app = el.closest('ion-app');
            if (app) {
              app.setFocus([el]);
            }
          }
        </script>
      </ion-content>
    </ion-app>
  </body>
</html>
