<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datetime</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />
    <style>
      ion-datetime {
        width: 350px;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-datetime presentation="date" value="2023-01-01"></ion-datetime>
        </div>
      </ion-content>
    </ion-app>

    <script>
      const datetime = document.querySelector('ion-datetime');
      datetime.highlightedDates = [
        {
          date: '2023-01-05',
          textColor: '#800080',
          backgroundColor: '#ffc0cb',
          border: '1px solid #e91e63',
        },
        {
          date: '2023-01-10',
          textColor: '#09721b',
          backgroundColor: '#c8e5d0',
          border: '1px solid #4caf50',
        },
        {
          date: '2023-01-20',
          textColor: 'var(--ion-color-secondary)',
          backgroundColor: 'rgb(var(--ion-color-secondary-rgb), 0.18)',
          border: '1px solid var(--ion-color-secondary-shade)',
        },
        {
          date: '2023-01-23',
          textColor: 'rgb(68, 10, 184)',
          backgroundColor: 'rgb(211, 200, 229)',
          border: '1px solid rgb(103, 58, 183)',
        },
      ];
    </script>
  </body>
</html>
