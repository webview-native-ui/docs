<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datetime</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      ion-datetime {
        --background: rgb(245, 235, 247);
        --background-rgb: 245, 235, 247;
        --wheel-highlight-background: rgb(218, 216, 255);
        --wheel-highlight-border-radius: 48px;
        --wheel-fade-background-rgb: 245, 235, 247;
      }

      ion-datetime::part(wheel):focus {
        background: rgb(109, 208, 164);
      }

      ion-datetime::part(wheel-item) {
        color: rgb(255, 66, 97);
      }

      ion-datetime::part(wheel-item active) {
        color: rgb(128, 30, 171);
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-datetime presentation="date" prefer-wheel="true"></ion-datetime>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
