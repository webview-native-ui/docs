<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badge</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      ion-tab-bar {
        flex: 1;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <ion-tab-bar color="light">
            <ion-tab-button tab="1">
              <ion-icon name="heart"></ion-icon>
              <ion-label>Favorites</ion-label>
              <ion-badge color="danger"></ion-badge>
            </ion-tab-button>

            <ion-tab-button tab="2">
              <ion-icon name="musical-note"></ion-icon>
              <ion-label>Music</ion-label>
            </ion-tab-button>

            <ion-tab-button tab="3">
              <ion-icon name="calendar"></ion-icon>
              <ion-label>Calendar</ion-label>
              <ion-badge color="danger">47</ion-badge>
            </ion-tab-button>
          </ion-tab-bar>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
