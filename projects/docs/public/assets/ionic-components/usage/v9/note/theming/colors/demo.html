<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note</title>
    <link rel="stylesheet" href="../../../common.css" />
    <script src="../../../common.js"></script>
    <script type="module" src="/assets/ionic-components/runtime/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="/assets/ionic-components/runtime/css/ionic.bundle.css" />

    <style>
      .flex-items {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        max-width: 440px;
      }

      ion-note {
        margin: 0 2px;
      }
    </style>
  <!-- Modified by WebView Native UI: load the local runtime and selected theme. -->
    <script>
      const previewTheme = new URLSearchParams(location.search).get('theme');
      if (['ios26','ios27','md'].includes(previewTheme)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/ionic-components/runtime/' + previewTheme + '.css';
        document.head.append(link);
      }
    </script></head>

  <body>
    <ion-app>
      <ion-content>
        <div class="container">
          <div class="flex-items">
            <ion-note>Default Note</ion-note>
            <ion-note color="primary">Primary Note</ion-note>
            <ion-note color="secondary">Secondary Note</ion-note>
            <ion-note color="tertiary">Tertiary Note</ion-note>
            <ion-note color="success">Success Note</ion-note>
            <ion-note color="warning">Warning Note</ion-note>
            <ion-note color="danger">Danger Note</ion-note>
            <ion-note color="light">Light Note</ion-note>
            <ion-note color="medium">Medium Note</ion-note>
            <ion-note color="dark">Dark Note</ion-note>
          </div>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
